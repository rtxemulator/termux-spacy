name: Build spaCy wheels for Termux cython fix

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Termux Python version to target (e.g. 3.12)'
        required: true
        default: '3.14'

jobs:
  build-wheels:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        package:
          - cymem
          - murmurhash
          - preshed
          - blis
          - "thinc==8.3.13"
          - "spacy==3.8.16"
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip/cargo inside container volume
        uses: actions/cache@v4
        with:
          path: termux-cache
          key: termux-${{ matrix.package }}-${{ hashFiles('**/workflow.yml') }}
          restore-keys: |
            termux-${{ matrix.package }}-

      - name: Pull Termux aarch64 image
        run: docker pull termux/termux-docker:aarch64

      - name: Build wheel in Termux container (aarch64)
        run: |
          mkdir -p dist termux-cache
          CID=$(docker create \
            -v ${{ github.workspace }}/termux-cache:/root/.cache \
            -e ANDROID_API_LEVEL=24 \
            termux/termux-docker:aarch64 \
            bash -c "
              pkg update -y &&
              pkg upgrade -y &&
              pkg install -y python python-pip clang rust make cmake pkg-config ninja python-numpy &&
              export CFLAGS='-Wno-error=implicit-function-declaration' &&
              export MAKEFLAGS='-j1' &&
              export BLIS_ARCH=generic &&
              export ANDROID_API_LEVEL=24 &&
              pip install --no-cache-dir 'Cython==3.1.6' &&
              python -c "import Cython; print('Cython:', Cython.__version__)" &&
              python -c "import sysconfig; print('SIZEOF_SIZE_T:', sysconfig.get_config_var('SIZEOF_SIZE_T')); print('SIZEOF_VOID_P:', sysconfig.get_config_var('SIZEOF_VOID_P'))" &&
              clang --version &&
              pip install --no-cache-dir https://github.com/Goplr/android-pydantic-core/releases/download/v2.46.5/pydantic_core-2.46.5-cp314-cp314-linux_aarch64.android_24_arm64_v8a.whl &&
              mkdir -p \$HOME/dist &&
              pip wheel ${{ matrix.package }} -w \$HOME/dist --no-cache-dir --no-deps &&
              python -m zipfile -t \$HOME/dist/*.whl &&
              ls -lh \$HOME/dist/*.whl &&
              sha256sum \$HOME/dist/*.whl
            ")
          docker start -a "$CID"
          docker cp "$CID:/data/data/com.termux/files/home/dist/." dist/
          docker rm "$CID"
          ls -la dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ strategy.job-index }}
          path: dist/*.whl

  bundle:
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: all-wheels
          pattern: wheel-*
          merge-multiple: true

      - name: Bundle into single artifact
        uses: actions/upload-artifact@v4
        with:
          name: spacy-termux-wheels-bundle
          path: all-wheels/*.whl

