name: Build spaCy wheels for Termux

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Termux Python version to target (e.g. 3.12)'
        required: true
        default: '3.12'

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - cymem
          - murmurhash
          - preshed
          - blis
          - thinc
          - spacy
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip/cargo inside container volume
        uses: actions/cache@v4
        with:
          path: termux-cache
          key: termux-${{ matrix.package }}-${{ hashFiles('**/workflow.yml') }}
          restore-keys: |
            termux-${{ matrix.package }}-

      - name: Pull Termux Docker image
        run: docker pull termux/termux-docker:latest

      - name: Build wheel in Termux container
        run: |
          mkdir -p dist termux-cache
          docker run --rm \
            -v ${{ github.workspace }}/dist:/build/dist \
            -v ${{ github.workspace }}/termux-cache:/root/.cache \
            termux/termux-docker:latest \
            bash -c "
              pkg update -y &&
              pkg install -y python python-pip clang rust make cmake pkg-config &&
              export CFLAGS='-Wno-error=implicit-function-declaration' &&
              export MAKEFLAGS='-j1' &&
              pip wheel ${{ matrix.package }} -w /build/dist --no-cache-dir --no-deps
            "

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.package }}
          path: dist/*.whl

  bundle:
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: all-wheels
          pattern: wheel-*
          merge-multiple: true

      - name: Bundle into single artifact
        uses: actions/upload-artifact@v4
        with:
          name: spacy-termux-wheels-bundle
          path: all-wheels/*.whl
          
  smoke-test:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spacy-termux-wheels-bundle
          path: wheels

      - name: Import test inside Termux container
        run: |
          docker run --rm -v ${{ github.workspace }}/wheels:/wheels \
            termux/termux-docker:latest \
            bash -c "
              pkg install -y python python-pip &&
              pip install /wheels/*.whl --no-cache-dir &&
              python -c 'import spacy; print(spacy.__version__)'
            "