name: Build spaCy wheel
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in Termux container
        run: |
          docker run --rm -v ${{ github.workspace }}:/build termux/termux-docker:latest \
            bash -c "pkg update -y && pkg install -y python python-pip clang rust make && \
                     pip wheel spacy -w /build/dist --no-cache-dir"
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: always()
        timeout-minutes: 30
    
      - uses: actions/upload-artifact@v4
        with:
          name: spacy-termux-wheel
          path: dist/*.whl
